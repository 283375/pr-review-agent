# Composite (not `using: node24`): the pipeline spawns pi as a separate
# process from node_modules — pi/gondolin cannot be bundled into a
# self-contained JS file, so dependencies are installed declaratively here
# (the pattern claude-code-action uses) instead of ad-hoc inside the JS entry.
name: 'PR Review Agent (review)'
description: >
  Runs the AI review pipeline for one /review trigger. The pi/gondolin
  runtime is installed on the runner; the reviewed PR is the checked-out
  workspace. Host-side only — the agent itself runs in a Gondolin micro-VM.
inputs:
  github-token:
    description: 'Token for PR comments and API reads'
    required: true
  llm-provider:
    description: 'LLM provider: a gateway model id from models.json, or a native provider (e.g. deepseek)'
    required: false
  llm-api-key:
    description: 'LLM API key (or SV_PR_REVIEW_AGENT_API_KEY env)'
    required: false
  llm-base-url:
    description: 'LLM base URL (gateway mode only)'
    required: false
  llm-model:
    description: 'LLM model id'
    required: false
  review-timeout-minutes:
    description: 'Hard timeout for the pi session'
    required: false
    default: '15'
  command:
    description: 'Trigger command to match'
    required: false
    default: '/review'
outputs:
  review-published:
    description: 'Whether the review was published'
    value: ${{ steps.review.outputs.review-published }}
  reason:
    description: 'Pipeline decision'
    value: ${{ steps.review.outputs.reason }}
  findings-count:
    description: 'Number of findings in the review'
    value: ${{ steps.review.outputs.findings-count }}
  artifact-path:
    description: 'Directory with session artifacts (redacted)'
    value: ${{ steps.review.outputs.artifact-path }}
  review-url:
    description: 'URL of the published review comment'
    value: ${{ steps.review.outputs.review-url }}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      with:
        version: 11.24.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
    - name: Install action dependencies
      shell: bash
      # The action dir is review/ inside the fetched repo; the workspace root
      # (prompts/, gondolin/image.json, pnpm-workspace.yaml) is one level up.
      run: cd "$GITHUB_ACTION_PATH/.." && pnpm install --frozen-lockfile
    - id: review
      shell: bash
      run: node "$GITHUB_ACTION_PATH/dist/review.cjs"
      env:
        # @actions/core reads INPUT_<NAME> — composite actions do not inject
        # these automatically, so every input is mapped explicitly.
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_LLM-PROVIDER: ${{ inputs.llm-provider }}
        INPUT_LLM-API-KEY: ${{ inputs.llm-api-key }}
        INPUT_LLM-BASE-URL: ${{ inputs.llm-base-url }}
        INPUT_LLM-MODEL: ${{ inputs.llm-model }}
        INPUT_REVIEW-TIMEOUT-MINUTES: ${{ inputs.review-timeout-minutes }}
        INPUT_COMMAND: ${{ inputs.command }}
