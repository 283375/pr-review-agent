# Composite (not `using: node24`): pi and gondolin cannot be bundled into a
# self-contained JS file — the pipeline spawns pi from node_modules — so the
# dependencies are installed declaratively here.
name: 'PR Review Agent (review)'
description: >
  Runs the AI review pipeline for one /review trigger. The pi/gondolin
  runtime is installed on the runner; the reviewed PR is the checked-out
  workspace. Host-side only — the agent itself runs in a Gondolin micro-VM.
inputs:
  github-token:
    description: 'Token for PR comments and API reads'
    required: true
  allowed-actors:
    description: 'Same policy as the gate: __OWNER__/__MEMBER__/__COLLABORATOR__/__CONTRIBUTOR__ or numeric user IDs. The pipeline re-checks the comment author (defense against wiring mistakes); __MEMBER__ needs a token with read:org plus can-see-private-members, otherwise it fails closed here.'
    required: true
  can-see-private-members:
    description: 'Set true when github-token carries read:org, so the __MEMBER__ re-check can distinguish 404 from inability'
    required: false
    default: 'false'
  llm-provider:
    description: 'LLM provider: a gateway model id from models.json, or a native provider (e.g. deepseek)'
    required: false
  llm-api-key:
    description: 'LLM API key (or SV_PR_REVIEW_AGENT_API_KEY env)'
    required: false
  llm-base-url:
    description: 'LLM base URL (gateway mode only)'
    required: false
  llm-model:
    description: 'LLM model id'
    required: false
  review-timeout-minutes:
    description: 'Hard timeout for the pi session'
    required: false
    default: '15'
  command:
    description: 'Trigger command to match'
    required: false
    default: '/review'
outputs:
  review-published:
    description: 'Whether the review was published'
    value: ${{ steps.review.outputs.review-published }}
  reason:
    description: 'Pipeline decision'
    value: ${{ steps.review.outputs.reason }}
  findings-count:
    description: 'Number of findings in the review'
    value: ${{ steps.review.outputs.findings-count }}
  artifact-path:
    description: 'Directory with session artifacts (redacted)'
    value: ${{ steps.review.outputs.artifact-path }}
  review-url:
    description: 'URL of the published review comment'
    value: ${{ steps.review.outputs.review-url }}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      with:
        version: 11.24.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
    - name: Install micro-VM runtime (QEMU)
      shell: bash
      # Gondolin runs its x86_64 micro-VMs through QEMU; qemu-img (in
      # qemu-utils) handles the disk image. Composite steps have no
      # timeout-minutes support (actions/runner#1979), so the cap is
      # shell-level: a stalled mirror hangs with zero output (observed:
      # 10+ minutes), which Acquire::*::Timeout bounds to ~30s per request.
      # The loop retries once for transient failures.
      run: |
        for i in 1 2; do
          if sudo timeout 300 apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update \
            && sudo timeout 300 apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y qemu-system-x86 qemu-utils; then
            exit 0
          fi
          echo "apt attempt $i failed; retrying" >&2
          sleep 5
        done
        exit 1
    - name: Install action dependencies
      shell: bash
      # The action dir is review/ inside the fetched repo; the workspace root
      # (prompts/, gondolin/image.json, pnpm-workspace.yaml) is one level up.
      # One retry under the same 5-minute cap as the QEMU step above.
      run: |
        cd "$GITHUB_ACTION_PATH/.."
        for i in 1 2; do
          if timeout 300 pnpm install --frozen-lockfile; then exit 0; fi
          echo "pnpm install attempt $i failed; retrying" >&2
          sleep 5
        done
        exit 1
    - id: review
      shell: bash
      run: node "$GITHUB_ACTION_PATH/dist/review.cjs"
      env:
        # @actions/core reads INPUT_<NAME> — composite actions do not inject
        # these automatically, so every input is mapped explicitly.
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_ALLOWED-ACTORS: ${{ inputs.allowed-actors }}
        INPUT_CAN-SEE-PRIVATE-MEMBERS: ${{ inputs.can-see-private-members }}
        INPUT_LLM-PROVIDER: ${{ inputs.llm-provider }}
        INPUT_LLM-API-KEY: ${{ inputs.llm-api-key }}
        INPUT_LLM-BASE-URL: ${{ inputs.llm-base-url }}
        INPUT_LLM-MODEL: ${{ inputs.llm-model }}
        INPUT_REVIEW-TIMEOUT-MINUTES: ${{ inputs.review-timeout-minutes }}
        INPUT_COMMAND: ${{ inputs.command }}
