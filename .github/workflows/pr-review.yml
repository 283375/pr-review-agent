# Self-test wiring: this action runs on its own repository so the trigger →
# gate → review path can be exercised with real events.
#
# Security notes:
# - The gate job checks out the DEFAULT branch before `uses: ./` (local
#   actions require a checkout) — never the PR head.
# - The review job pins `uses: owner/repo@main`: the pipeline code always
#   comes from the default branch, never from the checked-out PR head.
#   The PR head checkout exists only as the read-only workspace the agent
#   reviews.
name: PR Review (self-test)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
    steps:
      # Local action (`uses: ./`) needs the repo present; the default branch
      # is the safe ref for issue_comment triggers.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main

      - id: gate
        uses: ./
        with:
          allowed-actors: '__OWNER__'
          command: '/review'
          # __MEMBER__ is not used here yet; when it is, org repos need a
          # token with read:org plus `can-see-private-members: true`.
          github-token: ${{ secrets.GITHUB_TOKEN }}

  review:
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The reviewed workspace: PR head with full history (git log in the
      # sandbox). NOTE: this deliberately does NOT feed `uses:` below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/pull/${{ needs.gate.outputs.pr-number }}/head

      - id: review
        uses: 283375/pr-review-agent@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-provider: deepseek
          llm-api-key: ${{ secrets.SV_PR_REVIEW_AGENT_API_KEY }}
          llm-model: deepseek-v4-flash-vision-exp

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-review-artifacts-${{ needs.gate.outputs.pr-number }}
          path: ${{ steps.review.outputs.artifact-path }}
          retention-days: 7
          if-no-files-found: warn
