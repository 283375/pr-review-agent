# Reusable entrypoint: the complete trigger → gate → review wiring. Consumers
# call it from their own `issue_comment` workflow with a single `uses:`
# (see the README Quickstart); this repository's self-test is the reference
# caller (.github/workflows/self-test.yml).
#
# Job shape: the gate job runs the authorization action alone (contents:read,
# no checkout, never sees PR content); the review job — the only holder of
# the write token — starts only when the gate authorizes. New steps belong
# inside the review job: the job-level `if:` covers them, no per-step guards.
# The review action ALSO re-verifies the comment author in code (defense
# against wiring mistakes), so this `if:` is a cost guard, not the security
# boundary (see docs/security.md).
#
# Security notes:
# - Pipeline code always comes from the default branch (uses @main below);
#   the PR-head checkout exists only as the reviewed workspace.
# - A called workflow cannot elevate the GITHUB_TOKEN: the caller must grant
#   `pull-requests: write` for publishing to work.
name: PR Review

on:
  workflow_call:
    inputs:
      allowed-actors:
        description: 'Who may trigger a review: __OWNER__ / __MEMBER__ / __COLLABORATOR__ / __CONTRIBUTOR__ or numeric GitHub user IDs. Never logins (renamable).'
        required: true
        type: string
      command:
        description: 'Trigger command matched at the start of the comment body'
        required: false
        type: string
        default: '/review'
      llm-provider:
        description: 'gateway (default, any OpenAI-compatible endpoint) or a native pi provider (e.g. deepseek)'
        required: false
        type: string
      llm-base-url:
        description: 'LLM endpoint (gateway mode only)'
        required: false
        type: string
      llm-model:
        description: 'Model ID'
        required: false
        type: string
      review-timeout-minutes:
        description: 'Hard timeout for the pi session'
        required: false
        type: string
        default: '15'
    secrets:
      # Secret ids must not start with GITHUB_ (case-insensitive) — the
      # reserved prefix would fail workflow validation at parse time.
      token:
        description: 'Token for PR reads and publishing; defaults to github.token'
        required: false
      llm_api_key:
        description: 'LLM API key'
        required: true
    outputs:
      review-url:
        description: 'URL of the published review; unset when nothing was published'
        value: ${{ jobs.review.outputs.review-url }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
      review-wall: ${{ steps.wall.outputs.wall }}
    steps:
      - id: wall
        # The review job's wall = session timeout + 10 min of bootstrap
        # headroom, so the review action's inner timeout always fires first
        # and the fallback publish keeps an exit. Shell arithmetic: Actions
        # expressions have no arithmetic operators. A non-integer value fails
        # the job here — loud misconfiguration beats a silently clipped
        # session.
        run: |
          t="${{ inputs.review-timeout-minutes }}"
          case "$t" in
            *[!0-9]*|'') echo "::error::review-timeout-minutes must be a positive integer (minutes), got '$t'"; exit 1 ;;
          esac
          echo "wall=$((t + 10))" >> "$GITHUB_OUTPUT"
      - id: gate
        uses: 283375/pr-review-agent@main
        with:
          allowed-actors: ${{ inputs.allowed-actors }}
          command: ${{ inputs.command }}
          github-token: ${{ secrets.token || github.token }}

  review:
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    # Wall = session timeout + 10 (computed by the gate job): the review
    # action's inner timeout always fires first, so an over-long session ends
    # via the host-side fallback publish, while this wall only catches what
    # the inner layers cannot see — without it, the runner default is 6 hours.
    # Healthy runs finish in ~2-5 min and never reach it.
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.review-wall) }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      review-url: ${{ steps.review.outputs.review-url }}
    steps:
      # The reviewed workspace: PR head with full history (git log in the
      # sandbox). NOTE: this deliberately does NOT feed `uses:` below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/pull/${{ needs.gate.outputs.pr-number }}/head

      # No guest-image cache step on purpose: the cache key must track the
      # guest image spec, which lives in THIS repository — a caller workspace
      # has no gondolin/image.json to hash, and a key that never changes
      # would serve stale images forever. The pipeline builds the image per
      # run (~1 min) instead; see docs/maintenance.md for the cache follow-up.
      - id: review
        uses: 283375/pr-review-agent/review@main
        env:
          # Outside the artifact upload root: the pipeline's default guest
          # dir lives under RUNNER_TEMP/pr-review-artifacts, which this job
          # uploads as review artifacts.
          GONDOLIN_GUEST_DIR: ${{ runner.temp }}/pr-review-guest
        with:
          allowed-actors: ${{ inputs.allowed-actors }}
          command: ${{ inputs.command }}
          github-token: ${{ secrets.token || github.token }}
          llm-provider: ${{ inputs.llm-provider }}
          llm-api-key: ${{ secrets.llm_api_key }}
          llm-base-url: ${{ inputs.llm-base-url }}
          llm-model: ${{ inputs.llm-model }}
          review-timeout-minutes: ${{ inputs.review-timeout-minutes }}

      - name: Upload review artifacts
        # Fixed path (deterministic: RUNNER_TEMP/pr-review-artifacts), not the
        # output — a crash before the output is set must still upload partial
        # artifacts for debugging.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-review-artifacts-${{ needs.gate.outputs.pr-number }}
          path: ${{ runner.temp }}/pr-review-artifacts
          retention-days: 7
          if-no-files-found: warn
